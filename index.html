// ---------- calculator maths: a small safe parser (no eval) ----------
// supports + − × ÷ ^, brackets, decimals, negative numbers, sqrt( ) or √, and pi
function calcEval(src){
  const s=String(src).replace(/\s+/g,'').replace(/[−–]/g,'-').replace(/[×·]/g,'*').replace(/÷/g,'/').replace(/√/g,'sqrt').replace(/π/g,'pi').toLowerCase();
  if(!s) throw new Error('Type a calculation');
  let i=0;
  const peek=()=>s[i], eat=c=>{ if(s[i]===c){ i++; return true; } return false; };
  function expr(){ let v=term(); for(;;){ if(eat('+')) v+=term(); else if(eat('-')) v-=term(); else return v; } }
  function term(){ let v=unary(); for(;;){ if(eat('*')) v*=unary(); else if(eat('/')){ const d=unary(); if(d===0) throw new Error('Cannot divide by 0'); v/=d; } else if(peek()==='('||/[a-z]/.test(peek()||'')) v*=unary(); else return v; } }
  function unary(){ if(eat('-')) return -unary(); if(eat('+')) return unary(); return power(); }
  function power(){ const b=primary(); if(eat('^')){ const e=unary(); const r=Math.pow(b,e); if(!isFinite(r)||isNaN(r)) throw new Error('Not a real number'); return r; } return b; }
  function primary(){
    if(eat('(')){ const v=expr(); if(!eat(')')) throw new Error('Missing a closing bracket )'); return v; }
    if(s.startsWith('sqrt',i)){ i+=4; const v=primary(); if(v<0) throw new Error('No real answer: √ of a negative uses i (√'+(-v)+' × i)'); return Math.sqrt(v); }
    if(s.startsWith('pi',i)){ i+=2; return Math.PI; }
    const m2=/^\d*\.?\d+/.exec(s.slice(i)); if(!m2) throw new Error(i>=s.length?'The calculation is not finished':'I do not understand "'+s[i]+'"');
    i+=m2[0].length; return parseFloat(m2[0]);
  }
  const v=expr(); if(i<s.length) throw new Error(s[i]===')'?'Extra closing bracket )':'I do not understand "'+s[i]+'"');
  if(!isFinite(v)) throw new Error('Too big to show');
  return parseFloat(v.toPrecision(12));
}

  function renderQuestion(box, Q, onDone, opts){
    opts=opts||{}; box.innerHTML='';

        inp.oninput=()=>{state[pi]=inp.value;}; inp.onkeydown=e=>{ if(e.key==='Enter') check.click(); }; wrap.appendChild(inp); els.push(inp); }
      else { const g=document.createElement('div'); g.className='opts'; const btns=[];
        p.options.forEach((o,oi)=>{ const b=document.createElement('button'); b.type='button'; b.className='opt'; b.innerHTML=o;
          b.onclick=()=>{ if(check.disabled) return; SFX.click();
            if(p.type==='multi'){ const k=state[pi].indexOf(oi); if(k<0) state[pi].push(oi); else state[pi].splice(k,1); b.classList.toggle('sel'); }
            else { state[pi]=oi; btns.forEach(x=>x.classList.toggle('sel',x===b)); } };
          g.appendChild(b); btns.push(b); });
        wrap.appendChild(g); els.push(btns); }
      box.appendChild(wrap);
    });
    const check=document.createElement('button'); check.className='btn'; check.textContent='Check my answer';
    const show=document.createElement('button'); show.className='btn ghost'; show.textContent='Show me the steps';
    const msg=document.createElement('div'); const steps=document.createElement('ol'); steps.className='steps';
    box.appendChild(check); if(!opts.test) box.appendChild(show); box.appendChild(msg); box.appendChild(steps);
    let shown=0;
    function nextStep(all){ do { if(shown>=Q.steps.length) break; const li=document.createElement('li'); li.innerHTML=Q.steps[shown++]; steps.appendChild(li); } while(all);
      show.textContent = shown>=Q.steps.length ? 'All steps shown' : 'Show the next step'; show.disabled = shown>=Q.steps.length; }
    show.onclick=()=>{ SFX.step(); nextStep(false); };
    check.onclick=()=>{
      if(Q.parts.some((p,pi)=> p.type==='multi' ? state[pi].length===0 : (state[pi]===null||state[pi]===''))){ msg.className='msg bad'; msg.textContent='Answer every part first.'; return; }
      let all=true; const given=[];
      Q.parts.forEach((p,pi)=>{ let ok;
        if(p.type==='num'){ ok=sameNum(state[pi],p.a); els[pi].classList.add(ok?'right':'wrong'); els[pi].disabled=true; given.push(String(state[pi]).replace(/[<>&]/g,'')); }
        else if(p.type==='multi'){ const s=state[pi].slice().sort().join(','), a=p.a.slice().sort().join(','); ok=s===a; els[pi].forEach((b,oi)=>{ if(p.a.includes(oi)) b.classList.add('right'); else if(state[pi].includes(oi)) b.classList.add('wrong'); }); given.push(state[pi].slice().sort().map(i=>p.options[i]).join(' and ')); }
        else { ok=state[pi]===p.a; els[pi].forEach((b,oi)=>{ if(oi===p.a) b.classList.add('right'); else if(oi===state[pi]) b.classList.add('wrong'); }); given.push(p.options[state[pi]]); }
        if(!ok) all=false; });
      check.disabled=true; if(all) SFX.right(); else SFX.wrong();
      msg.className='msg '+(all?'good':'bad');
      msg.innerHTML= all ? 'Correct!' : opts.test ? 'Not quite. You will see the full working at the end of the test.' : 'Not quite. The right answer is ' + answerText(Q) + '. Read the steps below.';
      if(!all && !opts.test) nextStep(true);
      if(onDone) onDone(all, given.join(', '));
    };
  }

    function fit(){ const r=cv.getBoundingClientRect(), d=window.devicePixelRatio||1, w=Math.max(1,Math.round(r.width*d)), h=Math.max(1,Math.round(r.height*d)); if(cv.width===w&&cv.height===h) return;
      const keep=document.createElement('canvas'); keep.width=cv.width; keep.height=cv.height; if(cv.width&&cv.height) keep.getContext('2d').drawImage(cv,0,0);
      cv.width=w; cv.height=h; if(keep.width&&keep.height) ctx.drawImage(keep,0,0); }
    function pos(e){ const r=cv.getBoundingClientRect(), d=window.devicePixelRatio||1; return [(e.clientX-r.left)*d,(e.clientY-r.top)*d]; }
    function stroke(a,b){ const d=window.devicePixelRatio||1; ctx.lineCap='round'; ctx.lineJoin='round';
      if(mode==='erase'){ ctx.globalCompositeOperation='destination-out'; ctx.lineWidth=26*d; ctx.strokeStyle='#000'; } else { ctx.globalCompositeOperation='source-over'; ctx.lineWidth=SIZES[size][1]*d; ctx.strokeStyle=color; }
      ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke(); }
    cv.addEventListener('pointerdown',e=>{ e.preventDefault(); drawing=true; last=pos(e); stroke(last,[last[0]+0.01,last[1]+0.01]); try{ cv.setPointerCapture(e.pointerId); }catch(x){} });
    cv.addEventListener('pointermove',e=>{ if(!drawing) return; e.preventDefault(); const p=pos(e); stroke(last,p); last=p; });
    ['pointerup','pointercancel','pointerleave'].forEach(n=>cv.addEventListener(n,()=>{ drawing=false; }));
    function setMode(mm){ mode=mm; $('#wbpen').classList.toggle('on',mm==='pen'); $('#wberase').classList.toggle('on',mm==='erase'); cv.style.cursor=mm==='erase'?'cell':'crosshair'; }
    $('#wbpen').onclick=()=>{ SFX.click(); setMode('pen'); }; $('#wberase').onclick=()=>{ SFX.click(); setMode('erase'); };
    $('#wbsize').onclick=()=>{ SFX.click(); size=(size+1)%SIZES.length; $('#wbsize').textContent='Size: '+SIZES[size][0]; };
    $('#wbclear').onclick=()=>{ SFX.untick(); ctx.globalCompositeOperation='source-over'; ctx.clearRect(0,0,cv.width,cv.height); };
    $('#wbtall').onclick=()=>{ SFX.click(); const t=wb.classList.toggle('tall'); document.body.classList.toggle('wbtall',t); $('#wbtall').textContent=t?'Smaller':'Bigger'; fit(); };
    function toggle(open){ wb.classList.toggle('hide',!open); document.body.classList.toggle('wbopen',open); $('#wbbtn').classList.toggle('on',open); $('#wbside').classList.toggle('on',open); if(open) fit(); }
    $('#wbside').onclick=()=>$('#wbbtn').click();
    $('#wbbtn').onclick=()=>{ SFX.click(); toggle(wb.classList.contains('hide')); }; $('#wbclose').onclick=()=>{ SFX.click(); toggle(false); };
    window.addEventListener('resize',()=>{ if(!wb.classList.contains('hide')) fit(); });
  })();

  // ----- CALCULATOR -----
  (function(){ const box=$('#calc'), inp=$('#calcin'), out=$('#calcout'); let lastAns=null;
    const KEYS=[['7'],['8'],['9'],['÷','op'],['⌫','op'],['4'],['5'],['6'],['×','op'],['C','op'],['1'],['2'],['3'],['−','op'],['(','op'],['0'],['.'],['±','op'],['+','op'],[')','op'],['x²','op'],['^','op'],['√','op'],['Ans','op'],['=','eq']];
    function insert(t){ const a=inp.selectionStart==null?inp.value.length:inp.selectionStart, b=inp.selectionEnd==null?a:inp.selectionEnd; inp.value=inp.value.slice(0,a)+t+inp.value.slice(b); const c=a+t.length; try{ inp.setSelectionRange(c,c); }catch(e){} }
    function equals(){ try{ const v=calcEval(inp.value); lastAns=v; out.textContent='= '+neg(v); out.style.color=''; SFX.step(); }catch(e){ out.textContent=e.message; out.style.color='var(--bad)'; SFX.untick(); } }
    KEYS.forEach(([k,cls])=>{ const b=document.createElement('button'); b.type='button'; b.textContent=k; if(cls) b.className=cls; if(k==='⌫') b.setAttribute('aria-label','Delete'); if(k==='C') b.setAttribute('aria-label','Clear');
      b.onclick=()=>{ SFX.click();
        if(k==='=') return equals();
        if(k==='C'){ inp.value=''; out.innerHTML='&nbsp;'; return; }
        if(k==='⌫'){ const a=inp.selectionStart==null?inp.value.length:inp.selectionStart, e2=inp.selectionEnd==null?a:inp.selectionEnd; if(a!==e2) inp.value=inp.value.slice(0,a)+inp.value.slice(e2); else if(a>0){ inp.value=inp.value.slice(0,a-1)+inp.value.slice(a); try{ inp.setSelectionRange(a-1,a-1); }catch(x){} } return; }
        if(k==='±') return insert('(−');
        if(k==='x²') return insert('^2');
        if(k==='√') return insert('√(');
        if(k==='Ans') return insert(lastAns===null?'':(lastAns<0?'('+neg(lastAns)+')':String(lastAns)));
        insert(k); };
      $('#calckeys').appendChild(b); });
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); equals(); } });
    function toggle(open){ box.classList.toggle('hide',!open); $('#calcbtn').classList.toggle('on',open); $('#calcside').classList.toggle('on',open); }
    $('#calcside').onclick=()=>$('#calcbtn').click();
    $('#calcbtn').onclick=()=>{ SFX.click(); toggle(box.classList.contains('hide')); }; $('#calcclose').onclick=()=>{ SFX.click(); toggle(false); };
  })();

  // ----- FORMULAS AND WORDS -----
  (function(){ const root=$('#sheet');
    root.innerHTML='<div class="card"><h2>Formulas and rules to know</h2>'+
    '<div class="rule"><b>OIL RIG:</b> Oxidation Is Loss of electrons (number goes up). Reduction Is Gain of electrons (number goes down).</div>'+
    '<div class="rule"><b>Agents:</b> the reducing agent is oxidized. The oxidizing agent is reduced.</div>'+
    '<div class="rule"><b>Oxidation numbers:</b> element alone = 0; one-atom ion = its charge; O = −2; H = +1; Group 1 = +1; Group 2 = +2; total = 0 for a compound, or the charge of an ion.</div>'+
    '<div class="rule"><b>Half-reactions:</b> electrons on the right = oxidation. Electrons on the left = reduction. Atoms and charge must balance.</div>'+
    '<div class="rule"><b>AN OX, RED CAT:</b> anode = oxidation, cathode = reduction. Electrons flow in the wire from anode to cathode. Ions move in the salt bridge.</div>'+
    '<div class="rule"><b>Anode:</b> the metal with the more negative E°.</div>'+
    '<div class="rule"><b>Cell potential:</b> '+c('E°cell = E°cathode − E°anode')+'. Do not multiply by the number of electrons. A working cell is positive. Units: V.</div>'+
    '<div class="rule"><b>Efficiency:</b> '+c('Efficiency (%) = (useful ÷ stored) × 100')+'<br>'+c('stored = useful ÷ decimal')+' and '+c('useful = stored × decimal')+'</div>'+
    '<div class="rule"><b>Protecting iron:</b> only a metal more reactive than iron (E° more negative than −0.44 V) protects it. A less reactive metal makes iron corrode faster.</div>'+
    '<div class="rule"><b>Data questions:</b> limits first, then priorities, quote numbers with units, name the trade-off.</div>'+
    '<div class="rule"><b>CER:</b> Claim (one-sentence answer), Evidence (at least two numbers with units), Reasoning (the chemistry that explains why).</div></div>'+
    '<div class="card"><h2>Command terms</h2><table style="width:100%"><tr><th>Command term</th><th>What to do</th></tr>'+TERMS.map(t=>'<tr><td><b>'+t[0]+'</b></td><td style="text-align:left">'+t[1]+'</td></tr>').join('')+'</table></div>'+
    '<div class="card"><h2>Words for the exam</h2><dl>'+[
     ['Oxidation','Loss of electrons. The oxidation number increases.'],['Reduction','Gain of electrons. The oxidation number decreases.'],['Redox reaction','A reaction where oxidation and reduction happen together.'],['Oxidizing agent','Accepts electrons and is itself reduced.'],['Reducing agent','Donates electrons and is itself oxidized.'],
     ['Oxidation number','A number that tracks the electrons an atom has lost or gained.'],['Half-reaction','One half of a redox reaction, written with its electrons.'],['Displacement reaction','A more reactive metal takes the place of a less reactive metal in a solution.'],['Spectator ion','An ion with the same form and oxidation number on both sides. It takes no part in the electron transfer.'],
     ['Voltaic cell','Turns chemical energy into electrical energy using a spontaneous redox reaction.'],['Spontaneous','Happens by itself.'],['Anode','The electrode where oxidation happens.'],['Cathode','The electrode where reduction happens.'],['Salt bridge','Lets ions move to keep each half-cell neutral and complete the circuit.'],
     ['Standard reduction potential (E°)','How strongly an ion gains electrons, in volts. More negative means the metal is more easily oxidized.'],['Standard cell potential (E°cell)','The voltage of the whole cell: E°cathode − E°anode.'],
     ['Efficiency','The percentage of stored chemical energy that comes out as useful electrical energy.'],['Primary battery','Not normally rechargeable.'],['Secondary battery','Designed to be recharged.'],['Cycle life','How many charge cycles a battery lasts.'],
     ['Corrosion','Gradual damage to a metal from reactions with its surroundings.'],['Barrier method','Paint, epoxy or plastic that blocks oxygen and water.'],['Galvanizing','A zinc coating. Protects steel even when scratched.'],['Sacrificial anode','A more reactive metal connected to steel. It oxidizes instead of the steel and is slowly used up.'],
     ['Trade-off','What you give up to get what you want.'],['Limitation','A reason an experiment may not show the whole truth.']
    ].map(w=>'<dt>'+w[0]+'</dt><dd>'+w[1]+'</dd>').join('')+'</dl></div>'+

    const SC=['I can state what oxidation and reduction mean in terms of electrons and oxidation numbers.','I can work out oxidation numbers, including in polyatomic ions.','I can label oxidizing and reducing agents correctly.','I can write a half-reaction with electrons on the correct side and balanced charge.','I can identify spectator ions and explain electron transfer in a displacement reaction.','I can label anode, cathode and electron flow, and calculate E°cell with working and units.','I can calculate efficiency (and rearrange it to find stored energy).','I can check every limit in a data question and quote numbers in my justification.','I can explain how galvanizing and sacrificial anodes protect steel, using electron transfer.','I can write a full Claim, Evidence, Reasoning answer and name the limitation of a short test.'];
    let sc=store.get('chem10_selfcheck',{});
    SC.forEach((t,i)=>{ const lab=document.createElement('label'); lab.className='tickbox'; lab.style.marginTop='8px'; lab.style.fontWeight='400'; const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=!!sc[i];
      cb.onchange=()=>{ sc[i]=cb.checked; store.set('chem10_selfcheck',sc); if(cb.checked) SFX.tick(); else SFX.untick(); }; lab.appendChild(cb); lab.appendChild(document.createTextNode(' '+t)); $('#selfcheck').appendChild(lab); });
